name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # No LFS: the synthetic fixtures need no provider data, so no LFS quota is spent.
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.10.4"
      - name: Python from .python-version
        run: |
          cat .python-version
          uv python install
          uv run python --version
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Tests (a skipped test fails the run, see tests/conftest.py)
        run: uv run pytest -q
      - name: Real-data tests deselected here
        run: uv run pytest -m realdata --collect-only -q | tail -n 1
