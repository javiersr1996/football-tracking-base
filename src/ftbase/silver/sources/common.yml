version: 2

sources:
  - name: bronze_common
    description: Tables that are not one sport's, written by a probe rather than by an ingest.
    meta:
      external_location: "{{ env_var('TRACKLAB_DATA_ROOT', 'data') }}/bronze/common/{name}/data.parquet"
    tables:
      - name: orientation
        description: >
          Task 9. One row per (sport, match, period, team) with the sign of the
          attack and the evidence that fixed it. 162 rows: 82 basketball, 80
          football. dim_team_period is this table with silver keys.

  - name: reports
    description: >
      The CSV artefacts the probes print. A number this project publishes is read
      from the artefact that produced it, never retyped into a model.
    meta:
      external_location: "{{ var('reports_dir', 'reports') }}/{name}.csv"
    tables:
      - name: orientation_basketball
        description: >
          Task 9, one row per match. dim_match reads `court` from here: the court
          is a measurement (hoop at -40.75 ft, three-point arc at 22.15 ft,
          shots.distance residual 0.014 ft against FIBA and 1.0 against 94x50),
          not a constant someone decided.

  - name: manifest
    description: >
      The ingest manifest. It is the only place that knows which commit of each
      provider repository the bytes came from, so dim_match.source_commit is
      read from it rather than retyped.
    meta:
      external_location: "{{ var('manifest_path', 'manifest') }}/{name}.json"
    tables:
      - name: sources
        description: One entry per source, with its repo, its pinned commit and its sport.
