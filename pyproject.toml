[project]
name = "ftbase"
version = "0.1.0"
description = "Open pipeline for SkillCorner open football data."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
]

[project.scripts]
ftbase = "ftbase.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftbase"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true  # pyarrow ships no stubs and no py.typed marker

[tool.pytest.ini_options]
testpaths = ["tests"]
# Contract tests on the real bundle are deselected here (not skipped): `pytest -m realdata`.
addopts = "-m 'not realdata'"
markers = ["realdata: needs the real bundle ingested and built under $FTBASE_DATA_ROOT"]
