version: 2

models:
  - name: dim_sport
    description: >
      The two rows that turn `sport` into a column. Every constant of a bundle
      that silver needs lives here once: the unit and its factor to metres, the
      sample rate, the semantics of the official clock, how many players are on
      the surface and which frame the provider's events arrive in.
    columns:
      - name: sport
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["basketball", "football"]
      - name: id_prefix
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["bb", "fb"]
      - name: unit_to_m
        data_tests:
          - not_null
      - name: sample_rate_hz
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [25, 10]
                quote: false
      - name: clock_kind
        description: countdown in basketball (600 -> 0), elapsed in football.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["countdown", "elapsed"]
      - name: players_on_surface
        data_tests:
          - not_null
      - name: native_event_frame
        description: >
          The frame the provider's events arrive in, before silver rotates them
          to the venue frame. Measured by task 9 in both sports.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["attacking_neg_x", "attacking_pos_x", "venue"]

  - name: dim_match
    description: One row per match, 20 in total, with the surface, the periods and the pinned commit.
    columns:
      - name: match_id
        data_tests:
          - not_null
          - unique
      - name: sport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sport')
                field: sport
      - name: native_match_id
        data_tests:
          - not_null
      - name: competition
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: kickoff_utc
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: away_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: home_score
        data_tests:
          - not_null
      - name: away_score
        data_tests:
          - not_null
      - name: surface_length_m
        data_tests:
          - not_null
      - name: surface_width_m
        data_tests:
          - not_null
      - name: surface_spec
        description: fiba_28x15 in basketball, provider_<length>x<width> in football.
        data_tests:
          - not_null
      - name: n_periods
        description: Counted from dim_period, never declared. 4 or 5 in basketball, 2 in football.
        data_tests:
          - not_null
      - name: z_ball_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["biased", "measured", "unverified", "absent"]
      - name: z_player_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["constant_zero", "measured", "unverified", "absent"]
      - name: source_commit
        description: The provider commit the bytes came from, read from the ingest manifest.
        data_tests:
          - not_null

  - name: dim_period
    description: >
      One row per match and period. Football declares its boundaries in
      match.json; basketball's are read off the tracking, which is the only
      place its period changes.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["match_id", "period"]
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: period
        data_tests:
          - not_null
      - name: frame_native_start
        data_tests:
          - not_null
      - name: frame_native_end
        data_tests:
          - not_null
      - name: t_ms_start
        data_tests:
          - not_null
      - name: t_ms_end
        data_tests:
          - not_null
      - name: regulation_s
        description: What the competition gives the period, not what it lasted.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [600, 300, 2700]
                quote: false

  - name: dim_team
    description: One row per team, 30 in total (17 basketball, 13 football).
    columns:
      - name: team_id
        data_tests:
          - not_null
          - unique
      - name: sport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sport')
                field: sport
      - name: native_team_id
        data_tests:
          - not_null
      - name: name
        data_tests:
          - not_null

  - name: dim_team_period
    description: >
      Task 9 in silver keys: which way each team attacks in each period, and the
      evidence that fixed it. Two rows per (match, period), opposite signs,
      asserted by tests/assert_attack_signs_opposite.sql.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["match_id", "period", "team_id"]
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: period
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: attack_sign
        description: +1 when that team attacks towards +x of the venue frame in that period.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-1, 1]
                quote: false
      - name: evidence
        data_tests:
          - not_null

  - name: dim_entity
    description: >
      Everything that can hold a position in a match: both benches and the ball.
      Built from the roster, which covers every id the tracking uses in both
      sports and also the players who never left the bench.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["match_id", "entity_id"]
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: entity_id
        data_tests:
          - not_null
      - name: entity_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["player", "ball"]
      - name: team_id
        description: NULL for the ball, which belongs to no team.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: name
        data_tests:
          - not_null

  - name: frames
    description: >
      The physical record of both sports in one shape: one row per match, native
      frame and entity, in metres and in the venue frame. Built from the tracking
      and from nothing else. Partitioned on disk by sport and native match id,
      because a silver match_id carries a colon and that is not a directory name
      on Windows.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["match_id", "frame_native", "entity_id"]
    columns:
      - name: sport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sport')
                field: sport
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: native_match_id
        data_tests:
          - not_null
      - name: period
        description: Never null; a frame outside every period does not reach silver.
        data_tests:
          - not_null
      - name: frame_native
        data_tests:
          - not_null
      - name: t_ms
        description: frame_native x 1000 / sample_rate_hz, exact in both sports.
        data_tests:
          - not_null
      - name: clock_s
        description: >
          The official clock in its own semantics: counting down from 600 s in
          basketball, elapsed within the period in football.
        data_tests:
          - not_null
      - name: entity_id
        data_tests:
          - not_null
      - name: entity_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["player", "ball"]
      - name: team_id
        description: NULL for the ball, which belongs to no team.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: x_m
        data_tests:
          - not_null
      - name: y_m
        data_tests:
          - not_null
      - name: z_m
        description: >
          NULL for every player in both sports (decision 6) and the provider's
          uncorrected value for the ball. assert_frames_z_only_on_the_ball.sql
          holds both halves of that.
      - name: is_detected
        description: >
          False means the provider extrapolated the position rather than seeing
          it.
        data_tests:
          - not_null

  - name: events
    description: >
      Every event of both bundles in one shape: 20 native families in basketball,
      4 plus the phases of play in football, and the football team possession
      this project derives. Coordinates are rotated to the venue frame, and a row
      whose rotation cannot be resolved carries none.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["match_id", "event_id"]
    columns:
      - name: sport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sport')
                field: sport
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: event_type
        description: The conformed vocabulary; everything the seed does not name is `other`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["possession", "player_possession", "pass", "shot", "other"]
      - name: native_family
        description: What the provider calls this family, and how `other` is told apart.
        data_tests:
          - not_null
      - name: period
        data_tests:
          - not_null
      - name: team_id
        description: NULL where the provider names no team, as in a basketball matchup.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: possession_id
        description: >
          The event_id of the possession this event belongs to. NULL for the
          football events that fall between two team possessions.

  - name: frame_possession
    description: >
      Which team possession a frame belongs to. A view, because expanding the
      possessions to their frames would write tens of millions of rows that are
      one range join away from what silver already holds.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["match_id", "frame_native"]
    columns:
      - name: match_id
        data_tests:
          - not_null
      - name: frame_native
        data_tests:
          - not_null
      - name: possession_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('events')
                field: event_id
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

  - name: frames_attacking
    description: >
      The frames of a team possession, turned so the team with the ball attacks
      towards +x: x_att_m = attack_sign * x_m. The only attack normalisation in
      silver. A frame no possession claims is absent, never given a guessed sign.
    columns:
      - name: attack_sign
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-1, 1]
                quote: false

seeds:
  - name: surface_spec
    description: >
      The surface specs a match can be played on, with their dimensions in
      metres. Two rows: the FIBA court task 9 measured, and the NBA court it
      rejected, kept so the rejection stays visible instead of disappearing into
      a WHERE clause. Football does not appear here because its pitch is
      declared per match by the provider.
    columns:
      - name: surface_spec
        data_tests:
          - not_null
          - unique
      - name: length_m
        data_tests:
          - not_null
      - name: width_m
        data_tests:
          - not_null

  - name: event_type_map
    description: >
      The conformed vocabulary, one row per (sport, native family, subtype
      pattern). A row with a literal subtype wins over the `*` of its family,
      which is how a football player_possession that ended in a pass becomes a
      `pass` while the rest stay `player_possession`.
    columns:
      - name: sport
        data_tests:
          - not_null
      - name: native_family
        data_tests:
          - not_null
      - name: event_type
        data_tests:
          - not_null
